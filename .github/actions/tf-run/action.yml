name: Run Terraform
description: OIDC, workspace lock, and scripts/tf for plan, apply, unlock, or preview.

inputs:
  command:
    description: plan, apply, unlock, or preview
    required: true
  ref:
    description: Commit to check out
    required: true
  workspace:
    description: Workspace. Empty for preview, then it comes from head-ref.
    required: false
    default: ""
  head-ref:
    description: Branch name for the lock
    required: true
  pr:
    description: Pull request number, empty for a preview push
    required: false
    default: ""
  comment-id:
    description: Comment to react to
    required: false
    default: ""
  role-arn:
    description: IAM role for OIDC
    required: true
  aws-region:
    description: Region for the AWS sign-in
    required: true
  executable:
    description: terraform or tofu. Empty reads tool from pipeline.json.
    required: false
    default: ""
  github-token:
    description: Token for comments and artifacts
    required: false
    default: ""
  secrets-tfvars:
    description: Content of environments/<env>.secrets.tfvars
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Save scripts
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/tf-run"
        cp -a "${{ github.action_path }}" "$RUNNER_TEMP/tf-run"

    - name: Check out commit
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1
        persist-credentials: false

    - name: Check role
      shell: bash
      env:
        ROLE: ${{ inputs.role-arn }}
        PR_NUMBER: ${{ inputs.pr }}
      run: |
        if [[ -z "$ROLE" ]]; then
          echo "Variable AWS_ROLE_ARN is missing." >&2
          if [[ -n "$PR_NUMBER" ]]; then
            printf '### Terraform\n\nVariable `AWS_ROLE_ARN` is missing.\n' > "$RUNNER_TEMP/tf-comment-err.md"
          fi
          exit 1
        fi

    - name: Select tool
      id: tool
      shell: bash
      env:
        INPUT_EXECUTABLE: ${{ inputs.executable }}
      run: |
        if [[ -n "$INPUT_EXECUTABLE" ]]; then
          tool="$INPUT_EXECUTABLE"
        else
          tool=$(bash scripts/pipeline.sh tool)
        fi
        case "$tool" in
          terraform|tofu) ;;
          *)
            echo "EXECUTABLE must be terraform or tofu, not '$tool'." >&2
            exit 1
            ;;
        esac
        echo "executable=$tool" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      if: ${{ inputs.command != 'unlock' && steps.tool.outputs.executable == 'terraform' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.10.5"
        terraform_wrapper: false

    - name: Install OpenTofu
      if: ${{ inputs.command != 'unlock' && steps.tool.outputs.executable == 'tofu' }}
      uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: "1.10.5"
        tofu_wrapper: false

    - name: Sign in to AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-tf-${{ github.run_id }}

    - name: Run Terraform
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        GIT_SHA: ${{ inputs.ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        TF_WORKSPACE: ${{ inputs.workspace }}
        PR_NUMBER: ${{ inputs.pr }}
        TF_EXECUTABLE: ${{ steps.tool.outputs.executable }}
        TF_SECRETS_TFVARS: ${{ inputs.secrets-tfvars }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$RUNNER_TEMP/tf-run/run.sh"

    - name: Save plan
      id: upload
      if: steps.run.outputs.upload_plan == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.run.outputs.artifact_name }}
        path: ${{ steps.run.outputs.plan_file }}
        retention-days: 14
        if-no-files-found: error

    - name: Release lock if the plan was not saved
      if: steps.run.outputs.upload_plan == 'true' && steps.upload.outcome == 'failure'
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/tf-lock-held.env" ]]; then
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/tf-lock-held.env"
          bash "$RUNNER_TEMP/tf-run/lock.sh" release
        fi

    - name: Pull request comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: bash "$RUNNER_TEMP/tf-run/post-comment.sh"

    - name: Reaction
      if: always() && inputs.comment-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_ID: ${{ inputs.comment-id }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
      run: |
        content="-1"
        if [[ "$RUN_OUTCOME" == "success" && "$UPLOAD_OUTCOME" != "failure" ]]; then
          content="+1"
        fi
        gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
          -f content="$content" >/dev/null || true
