name: Run Terraform
description: OIDC, workspace lock, and scripts/tf for plan, apply, unlock, preview, release, or destroy.

inputs:
  command:
    description: plan, apply, unlock, preview, release, or destroy
    required: true
  ref:
    description: Commit to check out
    required: true
  workspace:
    description: Workspace. Empty for preview, then it comes from head-ref.
    required: false
    default: ""
  head-ref:
    description: Branch name for the lock
    required: true
  pr:
    description: Pull request number, empty for a preview push
    required: false
    default: ""
  comment-id:
    description: Comment to react to
    required: false
    default: ""
  role-arn:
    description: IAM role for OIDC
    required: true
  aws-region:
    description: Region for the AWS sign-in
    required: true
  executable:
    description: terraform or tofu. Empty reads tool from pipeline.json.
    required: false
    default: ""
  github-token:
    description: Token for comments
    required: false
    default: ""
  secrets-tfvars:
    description: Content of environments/<env>.secrets.tfvars
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Save scripts
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        rm -rf "$RUNNER_TEMP/tf-run"
        cp -a "$ACTION_PATH" "$RUNNER_TEMP/tf-run"

    - name: Check out commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 1
        persist-credentials: false

    - name: Check role
      shell: bash
      env:
        ROLE: ${{ inputs.role-arn }}
        PR_NUMBER: ${{ inputs.pr }}
      run: |
        if [[ -z "$ROLE" ]]; then
          echo "Variable AWS_ROLE_ARN is missing." >&2
          if [[ -n "$PR_NUMBER" ]]; then
            printf '### Terraform\n\nVariable `AWS_ROLE_ARN` is missing for this job (repository or GitHub environment).\n' > "$RUNNER_TEMP/tf-comment-err.md"
          fi
          exit 1
        fi

    - name: Select tool
      id: tool
      shell: bash
      env:
        INPUT_EXECUTABLE: ${{ inputs.executable }}
      run: |
        if [[ -n "$INPUT_EXECUTABLE" ]]; then
          tool="$INPUT_EXECUTABLE"
        else
          tool=$(bash scripts/pipeline.sh tool)
        fi
        case "$tool" in
          terraform|tofu) ;;
          *)
            echo "EXECUTABLE must be terraform or tofu, not '$tool'." >&2
            exit 1
            ;;
        esac
        echo "executable=$tool" >> "$GITHUB_OUTPUT"

    # The version comes from .terraform-version in the checked-out commit, so
    # the pipeline and the developer machines run the same release.
    - name: Read tool version
      id: version
      shell: bash
      run: |
        if [[ -f .terraform-version ]]; then
          version=$(tr -d '[:space:]' < .terraform-version)
        else
          echo "::warning::.terraform-version is missing, installing the latest release."
          version=latest
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install Terraform
      if: ${{ inputs.command != 'unlock' && inputs.command != 'release' && steps.tool.outputs.executable == 'terraform' }}
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.version.outputs.version }}
        terraform_wrapper: false

    - name: Install OpenTofu
      if: ${{ inputs.command != 'unlock' && inputs.command != 'release' && steps.tool.outputs.executable == 'tofu' }}
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: ${{ steps.version.outputs.version }}
        tofu_wrapper: false

    - name: Sign in to AWS
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-tf-${{ github.run_id }}

    - name: Run Terraform
      id: run
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        GIT_SHA: ${{ inputs.ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        TF_WORKSPACE: ${{ inputs.workspace }}
        PR_NUMBER: ${{ inputs.pr }}
        TF_EXECUTABLE: ${{ steps.tool.outputs.executable }}
        TF_SECRETS_TFVARS: ${{ inputs.secrets-tfvars }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$RUNNER_TEMP/tf-run/run.sh"

    - name: Pull request comment
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
      run: bash "$RUNNER_TEMP/tf-run/post-comment.sh"

    - name: Reaction
      if: always() && inputs.comment-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        COMMENT_ID: ${{ inputs.comment-id }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
      run: |
        content="-1"
        if [[ "$RUN_OUTCOME" == "success" ]]; then
          content="+1"
        fi
        gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
          -f content="$content" >/dev/null || true
